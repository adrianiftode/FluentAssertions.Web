version: 0.0.0-ci-{build}
# A non release build never publishes; only tags do. See the deploy section.

image: Visual Studio 2026

branches:
  only:
    - master
    - master-v8
    - /\d+\.\d+\.\d+/

pull_requests:
  do_not_increment_build_number: false

skip_branch_with_pr: true

configuration: Release

shallow_clone: true

environment:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

skip_commits:
  files:
    - "**/*.md"
    - .gitignore
    - .editorconfig
    - samples/**/*
  message: /.*skip\sci.*/

init:
  - cmd: dotnet --version

  # The tag no longer dictates package versions. Each csproj carries its own
  # <Version>, so a release can bump only the packages that changed. The tag is
  # still just the release trigger, and the label keeps it visible in the UI.
  - ps: |
      $ErrorActionPreference = "Stop"
      if ($env:APPVEYOR_REPO_TAG -eq "true") {
          try {
              Update-AppveyorBuild -Version "$($env:APPVEYOR_REPO_TAG_NAME) (release)"
          }
          catch {
              throw "Failed to update build label from tag: $_"
          }
      }

  - ps: |
      Write-Host "APPVEYOR_BUILD_VERSION = '$env:APPVEYOR_BUILD_VERSION'"
      Write-Host "APPVEYOR_REPO_TAG_NAME = '$env:APPVEYOR_REPO_TAG_NAME'"
      Write-Host "Pull Request = '$env:APPVEYOR_PULL_REQUEST_NUMBER'"

  - ps: |
      if (-not $env:APPVEYOR_PULL_REQUEST_NUMBER) {
          dotnet tool update -g dotnet-sonarscanner
          if ($LASTEXITCODE -ne 0) {
              dotnet tool install -g dotnet-sonarscanner
          }
      }

nuget:
  project_feed: true

before_build:
  - dotnet restore

build_script:
  - cmd: set JAVA_HOME=C:\Program Files\Java\jdk25
  - cmd: if not exist "%JAVA_HOME%\bin\java.exe" exit /b 1
  - cmd: set PATH=%JAVA_HOME%\bin;%PATH%

  - ps: |
      if (-not $env:APPVEYOR_PULL_REQUEST_NUMBER) {

          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
              throw "SONAR_TOKEN environment variable is missing."
          }

          $sonarArgs = @(
              "sonarscanner", "begin",
              "/k:adrianiftode_FluentAssertions.Web",
              "/o:adrianiftode-github",
              "/d:sonar.host.url=https://sonarcloud.io",
              "/d:sonar.token=$env:SONAR_TOKEN",
              "/v:$env:APPVEYOR_BUILD_NUMBER",
              "/d:sonar.cs.opencover.reportsPaths=**\coverage.opencover.xml",
              "/d:sonar.coverage.exclusions=test/**"
          )

          dotnet @sonarArgs

          if ($LASTEXITCODE -ne 0) {
              throw "SonarScanner begin failed."
          }
      }

  # No /p:Version here on purpose: versions come from each csproj so packages can
  # be released independently.
  - cmd: dotnet build -c %CONFIGURATION%

test_script:
  # Uses native coverlet collector to safely output an OpenCover report without altering compiled disk files
  - cmd: dotnet test --no-restore --no-build --nologo --verbosity:q /p:CollectCoverage=true --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

after_test:
  - ps: |
      if (-not $env:APPVEYOR_PULL_REQUEST_NUMBER) {

          dotnet sonarscanner end `
            /d:sonar.token="$env:SONAR_TOKEN"

          if ($LASTEXITCODE -ne 0) {
              throw "SonarScanner end failed."
          }
      }

  # Decide what this release publishes, then pack only that. Runs for every build
  # so a non release build still produces artifacts; the deploy section below is
  # what restricts publishing to tags.
  - ps: |
      $ErrorActionPreference = "Stop"

      # shallow_clone is on, so tags are missing and detection cannot work.
      if (-not (git tag)) {
          Write-Host "Fetching tags so release detection has a baseline to diff against."
          git fetch --tags --force --depth=200 origin
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch tags."
          }
      }

      if (-not (git tag)) {
          throw "No git tags available. Release detection needs at least one tag to diff against; push a baseline tag on the default branch."
      }

  - ps: |
      $ErrorActionPreference = "Stop"

      # A tag build publishes, so an already published version is a real error.
      # A branch build must not fail on it, because the bump happens later.
      $params = @{
          ChangedPackagesFile = "$env:APPVEYOR_BUILD_FOLDER\release-packages.txt"
          EnforceVersionCheck = ($env:APPVEYOR_REPO_TAG -eq "true")
      }

      & .\build\Get-ReleasePackages.ps1 @params

      if ($LASTEXITCODE -ne 0) {
          throw "Release package detection failed."
      }

      $selected = @(Get-Content "$env:APPVEYOR_BUILD_FOLDER\release-packages.txt" -ErrorAction SilentlyContinue | Where-Object { $_ })
      Write-Host "Release includes $($selected.Count) package(s): $($selected -join ', ')"

  - ps: |
      $ErrorActionPreference = "Stop"

      & .\build\Pack-ReleasePackages.ps1 `
        -SelectedPackagesFile "$env:APPVEYOR_BUILD_FOLDER\release-packages.txt" `
        -Configuration $env:CONFIGURATION `
        -RepositoryUrl "https://github.com/adrianiftode/FluentAssertions.Web" `
        -PublishableFeedsFile "$env:APPVEYOR_BUILD_FOLDER\publishable-feeds.txt"

      if ($LASTEXITCODE -ne 0) {
          throw "Packing the selected packages failed."
      }

artifacts:
  - path: '**\FluentAssertions.Web*.nupkg'
    name: FluentAssertionsPackages

  - path: '**\AwesomeAssertions.Web*.nupkg'
    name: AwesomeAssertionsPackages

  - path: '**\HttpMessageFormatter*.nupkg'
    name: HttpMessageFormatterPackage

  # Everything this release produced, regardless of feed. The GitHub release uses
  # this one artifact, because listing three artifact names would break whenever a
  # release only touches one of the feeds and the other artifacts stay empty.
  - path: '**\*.nupkg'
    name: ReleasePackages

deploy:
  # Each feed publishes only when the release actually included one of its
  # packages. PUBLISH_<FEED> is set by build/Pack-ReleasePackages.ps1, so a change
  # to one package leaves the other feeds untouched.
  - provider: NuGet
    api_key:
      secure: 6rs63nhNUqswGZO+5fPTAErKVSWuK015FkhlxPHuodj5F2i8ii+Im156iTCi7p6I
    skip_symbols: true
    artifact: FluentAssertionsPackages
    on:
      appveyor_repo_tag: true
      PUBLISH_FLUENTASSERTIONS: true

  - provider: NuGet
    api_key:
      secure: JK6J6voMfJm2FYMh52c2qv4CbRAQoz/lUZmPHqw93jy+bfiM4iTBmiusXAqlMsbV
    skip_symbols: true
    artifact: HttpMessageFormatterPackage
    on:
      appveyor_repo_tag: true
      PUBLISH_HTTPMESSAGEFORMATTER: true

  - provider: NuGet
    api_key:
      secure: gaPfZkebBqHImrgOgug/EV8v/LrAR93n8SjxTdi+wWPmuOE5/O8m13XZ5+vSApmH
    skip_symbols: true
    artifact: AwesomeAssertionsPackages
    on:
      appveyor_repo_tag: true
      PUBLISH_AWESOMEASSERTIONS: true

  - provider: GitHub
    release: $(APPVEYOR_REPO_TAG_NAME)
    auth_token:
      secure: WXU/Xj3ntIZVx89KDAa/V/FGerV2fURqVQJxrKIqMcCijmXeC065twmHPYQMWGBabafs1llkLbe6DMKRAGnz+GxwH8GpT3A86rcSOLxbsp4uRkeMRsLxWHI+eDHTonOY
    artifact: ReleasePackages
    on:
      appveyor_repo_tag: true
      PUBLISH_ANY: true
