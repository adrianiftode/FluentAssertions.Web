version: 0.0.0-ci-{build}
# A non release build never publishes; only tags do. See the deploy section.

image: Visual Studio 2026

branches:
  only:
    - master
    - master-v8
    - /\d+\.\d+\.\d+/

pull_requests:
  do_not_increment_build_number: false

skip_branch_with_pr: true

configuration: Release

# Must stay false. Release detection and the policy check are git operations, and
# shallow_clone made AppVeyor download a zip archive instead of cloning, so the
# checkout had no .git directory and every git call died with
# "fatal: not a git repository". A full clone of this repo is cheap.
shallow_clone: false

environment:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

skip_commits:
  files:
    - "**/*.md"
    - .gitignore
    - .editorconfig
    - samples/**/*
  message: /.*skip\sci.*/

init:
  - cmd: dotnet --version

  # The tag no longer dictates package versions. Each csproj carries its own
  # <Version>, so a release can bump only the packages that changed. The tag is
  # still just the release trigger, and the label keeps it visible in the UI.
  - ps: |
      $ErrorActionPreference = "Stop"
      if ($env:APPVEYOR_REPO_TAG -eq "true") {
          try {
              Update-AppveyorBuild -Version "$($env:APPVEYOR_REPO_TAG_NAME) (release)"
          }
          catch {
              throw "Failed to update build label from tag: $_"
          }
      }

  - ps: |
      Write-Host "APPVEYOR_BUILD_VERSION = '$env:APPVEYOR_BUILD_VERSION'"
      Write-Host "APPVEYOR_REPO_TAG_NAME = '$env:APPVEYOR_REPO_TAG_NAME'"
      Write-Host "Pull Request = '$env:APPVEYOR_PULL_REQUEST_NUMBER'"

  - ps: |
      if (-not $env:APPVEYOR_PULL_REQUEST_NUMBER) {
          dotnet tool update -g dotnet-sonarscanner
          if ($LASTEXITCODE -ne 0) {
              dotnet tool install -g dotnet-sonarscanner
          }
      }

nuget:
  project_feed: true

before_build:
  - dotnet restore

build_script:
  - cmd: set JAVA_HOME=C:\Program Files\Java\jdk25
  - cmd: if not exist "%JAVA_HOME%\bin\java.exe" exit /b 1
  - cmd: set PATH=%JAVA_HOME%\bin;%PATH%

  - ps: |
      if (-not $env:APPVEYOR_PULL_REQUEST_NUMBER) {

          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
              throw "SONAR_TOKEN environment variable is missing."
          }

          $sonarArgs = @(
              "sonarscanner", "begin",
              "/k:adrianiftode_FluentAssertions.Web",
              "/o:adrianiftode-github",
              "/d:sonar.host.url=https://sonarcloud.io",
              "/d:sonar.token=$env:SONAR_TOKEN",
              "/v:$env:APPVEYOR_BUILD_NUMBER",
              "/d:sonar.cs.opencover.reportsPaths=**\coverage.opencover.xml",
              # PowerShell build tooling and the netstandard2.0-only compiler polyfill
              # cannot be measured by the OpenCover report, so keep them out of the
              # new-code coverage denominator.
              "/d:sonar.coverage.exclusions=test/**,build/**,src/Assertions.Web.Shared/Polyfills/**"
          )

          dotnet @sonarArgs

          if ($LASTEXITCODE -ne 0) {
              throw "SonarScanner begin failed."
          }
      }

  # No /p:Version here on purpose: versions come from each csproj so packages can
  # be released independently.
  - cmd: dotnet build -c %CONFIGURATION%

test_script:
  # Uses native coverlet collector to safely output an OpenCover report without altering compiled disk files.
  # IncludeTestAssembly=true lets the source-shared internal helpers compiled into Assertions.Web.Tests
  # contribute coverage; those sources live under src/, so sonar.coverage.exclusions=test/** does not hide them.
  - cmd: dotnet test --no-restore --no-build --nologo --verbosity:q /p:CollectCoverage=true --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.IncludeTestAssembly=true

after_test:
  - ps: |
      if (-not $env:APPVEYOR_PULL_REQUEST_NUMBER) {

          dotnet sonarscanner end `
            /d:sonar.token="$env:SONAR_TOKEN"

          if ($LASTEXITCODE -ne 0) {
              throw "SonarScanner end failed."
          }
      }

  # Decide what this release publishes, then pack only that. Runs for every build
  # so a non release build still produces artifacts; the deploy section below is
  # what restricts publishing to tags.
  #
  # Release detection needs git history and tags to diff against. shallow_clone is
  # off so this is a real clone; the block below is the safety net for when the
  # checkout is not (a zip download has no .git directory, which used to kill every
  # later git call with "fatal: not a git repository"). Git's stderr is merged into
  # the log and judged by exit code, never by redirection under EAP=Stop, which
  # would raise a terminating error before any check could run.
  - ps: |
      $ErrorActionPreference = "Continue"

      $tags = @(git tag 2>&1)

      if ($LASTEXITCODE -ne 0) {
          if (-not (Test-Path -LiteralPath (Join-Path $env:APPVEYOR_BUILD_FOLDER ".git"))) {
              throw "This checkout has no .git directory, so release detection cannot work. Keep shallow_clone: false in appveyor.yml; a shallow or zip clone ships without git metadata."
          }

          throw "git tag failed (exit code $LASTEXITCODE): $($tags -join '; '). Release detection needs a working git clone."
      }

      if (-not ($tags | Where-Object { $_ })) {
          Write-Host "Fetching tags so release detection has a baseline to diff against."
          git fetch --tags --force origin
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch tags (exit code $LASTEXITCODE). Release detection needs at least one tag to diff against."
          }

          $tags = @(git tag 2>&1)
          if ($LASTEXITCODE -ne 0 -or -not ($tags | Where-Object { $_ })) {
              throw "No git tags available. Release detection needs at least one tag to diff against; push a baseline tag on the default branch."
          }
      }

  # The three scripts below fail by throwing, so reaching the end of a block means
  # it succeeded. $LASTEXITCODE is deliberately not checked after them: it holds
  # whatever the last git or dotnet call inside the script returned, and the
  # scripts are allowed to recover from a non-zero git exit code (that is how
  # detection falls back to publishing everything when the diff cannot be read).
  - ps: |
      $ErrorActionPreference = "Stop"

      # A tag build publishes, so an already published version is a real error.
      # A branch build must not fail on it, because the bump happens later.
      $params = @{
          ChangedPackagesFile = "$env:APPVEYOR_BUILD_FOLDER\release-packages.txt"
          EnforceVersionCheck = ($env:APPVEYOR_REPO_TAG -eq "true")
      }

      & .\build\Get-ReleasePackages.ps1 @params

      $selected = @(Get-Content "$env:APPVEYOR_BUILD_FOLDER\release-packages.txt" -ErrorAction SilentlyContinue | Where-Object { $_ })
      Write-Host "Release includes $($selected.Count) package(s): $($selected -join ', ')"

      # A tag on a feature branch may publish prereleases, but not stable version
      # numbers: nuget.org packages are immutable, so a stable version shipped from
      # an unmerged tag is burned forever. Skipped for branch builds, which do not
      # publish at all.
      if ($env:APPVEYOR_REPO_TAG -eq "true") {
          & .\build\Test-ReleasePolicy.ps1 `
              -SelectedPackagesFile "$env:APPVEYOR_BUILD_FOLDER\release-packages.txt"
      }
      else {
          $env:PUBLISH_ALLOWED = "false"
      }

  - ps: |
      $ErrorActionPreference = "Stop"

      & .\build\Pack-ReleasePackages.ps1 `
        -SelectedPackagesFile "$env:APPVEYOR_BUILD_FOLDER\release-packages.txt" `
        -Configuration $env:CONFIGURATION `
        -RepositoryUrl "https://github.com/adrianiftode/Assertions.Web" `
        -PublishableFeedsFile "$env:APPVEYOR_BUILD_FOLDER\publishable-feeds.txt"

artifacts:
  # Anchored to the package id via the '.' after the name: '**\Assertions.Web*.nupkg'
  # is a substring match that also claims FluentAssertions.Web*, FluentAssertions.Web.v8*
  # and AwesomeAssertions.Web*. AppVeyor gives each file to the first artifact whose
  # glob matches, so that shadowed the three flavoured artifacts below and sent
  # AwesomeAssertions.Web to the FluentAssertions feed key, which rejected it (403).
  - path: '**\Assertions.Web.*.nupkg'
    name: AssertionsWebPackages

  # FluentAssertions.Web and FluentAssertions.Web.v8 are isolated by project output
  # path: the name glob `FluentAssertions.Web*` matches both, so a name based
  # artifact could not tell the two flavours apart and could not be gated by a
  # per flavour flag.
  - path: 'src\FluentAssertions.Web\bin\**\*.nupkg'
    name: FluentAssertionsPackages

  - path: 'src\FluentAssertions.Web.v8\bin\**\*.nupkg'
    name: FluentAssertionsV8Packages

  - path: '**\AwesomeAssertions.Web*.nupkg'
    name: AwesomeAssertionsPackages

  - path: '**\HttpMessageFormatter*.nupkg'
    name: HttpMessageFormatterPackage

  - path: '**\Shouldly.Web*.nupkg'
    name: ShouldlyPackages

  # There is deliberately no catch-all '**\*.nupkg' artifact. AppVeyor gives each
  # file to the first artifact whose glob matches it, so the globs above claim
  # every nupkg and a catch-all would collect zero files. The GitHub release below
  # selects the named artifacts by regex instead.

deploy:
  # Three things must all be true to publish:
  #   appveyor_repo_tag  a tag was pushed, not just a branch commit
  #   PUBLISH_ALLOWED    build/Test-ReleasePolicy.ps1 allowed this tag to publish,
  #                      which excludes stable versions from unmerged branches
  #   PUBLISH_<FEED>     build/Pack-ReleasePackages.ps1 found packages for this
  #                      feed in the release, so an untouched feed is left alone
  #
  # The FluentAssertions feed produces three artifacts, so its feed flag alone cannot
  # gate a deploy that names one of them. FluentAssertionsPackages,
  # FluentAssertionsV8Packages and AssertionsWebPackages each also require
  # PUBLISH_FLUENTASSERTIONSWEB, PUBLISH_FLUENTASSERTIONSV8 and PUBLISH_ASSERTIONSWEB
  # respectively, which are true only when that artifact's packages are in this
  # release. That stops a deploy from naming an artifact the build never produced,
  # and lets FluentAssertions.Web and FluentAssertions.Web.v8 ship independently.
  #
  # The shared serializer package (Assertions.Web.Serializers.NewtonsoftJson) ships
  # on the FluentAssertions feed. Shouldly.Web is its own feed (Task 12), published
  # with its own key; the literal placeholder below is replaced by the owner.
  - provider: NuGet
    api_key:
      secure: 6rs63nhNUqswGZO+5fPTAErKVSWuK015FkhlxPHuodj5F2i8ii+Im156iTCi7p6I
    skip_symbols: true
    artifact: AssertionsWebPackages
    on:
      appveyor_repo_tag: true
      PUBLISH_ALLOWED: true
      PUBLISH_FLUENTASSERTIONS: true
      PUBLISH_ASSERTIONSWEB: true

  - provider: NuGet
    api_key:
      secure: 6rs63nhNUqswGZO+5fPTAErKVSWuK015FkhlxPHuodj5F2i8ii+Im156iTCi7p6I
    skip_symbols: true
    artifact: FluentAssertionsPackages
    on:
      appveyor_repo_tag: true
      PUBLISH_ALLOWED: true
      PUBLISH_FLUENTASSERTIONS: true
      PUBLISH_FLUENTASSERTIONSWEB: true

  - provider: NuGet
    api_key:
      secure: 6rs63nhNUqswGZO+5fPTAErKVSWuK015FkhlxPHuodj5F2i8ii+Im156iTCi7p6I
    skip_symbols: true
    artifact: FluentAssertionsV8Packages
    on:
      appveyor_repo_tag: true
      PUBLISH_ALLOWED: true
      PUBLISH_FLUENTASSERTIONS: true
      PUBLISH_FLUENTASSERTIONSV8: true

  - provider: NuGet
    api_key:
      secure: JK6J6voMfJm2FYMh52c2qv4CbRAQoz/lUZmPHqw93jy+bfiM4iTBmiusXAqlMsbV
    skip_symbols: true
    artifact: HttpMessageFormatterPackage
    on:
      appveyor_repo_tag: true
      PUBLISH_ALLOWED: true
      PUBLISH_HTTPMESSAGEFORMATTER: true

  - provider: NuGet
    api_key:
      secure: gaPfZkebBqHImrgOgug/EV8v/LrAR93n8SjxTdi+wWPmuOE5/O8m13XZ5+vSApmH
    skip_symbols: true
    artifact: AwesomeAssertionsPackages
    on:
      appveyor_repo_tag: true
      PUBLISH_ALLOWED: true
      PUBLISH_AWESOMEASSERTIONS: true

  - provider: NuGet
    api_key:
      secure: tOCTpsWpsK7vE2lMFPoo8lv5KM7cGI1Es1+B4xEGTU0gYZjDmvaUAQr6fvSns5kQ
    skip_symbols: true
    artifact: ShouldlyPackages
    on:
      appveyor_repo_tag: true
      PUBLISH_ALLOWED: true
      PUBLISH_SHOULDLY: true

  # The GitHub release carries the .nupkg files, so it is created only when at
  # least one package is actually being published. It selects artifacts by regex,
  # not by name: an explicit list fails when one flavour's artifact is empty, and
  # a named catch-all is shadowed by the per-flavour globs (that is what left the
  # 2.0.5 release with no assets). The regex matches every artifact deployment
  # name (each ends in "Package" or "Packages") and, as a fallback, any .nupkg
  # file path.
  - provider: GitHub
    release: $(APPVEYOR_REPO_TAG_NAME)
    auth_token:
      secure: WXU/Xj3ntIZVx89KDAa/V/FGerV2fURqVQJxrKIqMcCijmXeC065twmHPYQMWGBabafs1llkLbe6DMKRAGnz+GxwH8GpT3A86rcSOLxbsp4uRkeMRsLxWHI+eDHTonOY
    artifact: /.*(Packages?|\.nupkg)/
    on:
      appveyor_repo_tag: true
      PUBLISH_ALLOWED: true
      PUBLISH_ANY: true
